name: build peridot UEFI

# 在 GitHub 的 Ubuntu runner 上编译 peridot 的 UEFI 固件。
# 用法：仓库 Actions 页 → 左侧 "build peridot UEFI" → Run workflow → 跑完下载 artifact。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建类型"
        required: true
        default: "DEBUG"
        type: choice
        options: [DEBUG, RELEASE]
      allow_acpi_workaround:
        description: "报 AcpiTables 缺失时自动注释该组件并重试"
        required: true
        default: true
        type: boolean
      add_unixnu:
        description: "集成 UniXNUPkg + DarwinBootPkg（UniXNU 菜单与 XNU 加载器）"
        required: true
        default: true
        type: boolean
      add_probe:
        description: "注入 PeridotProbe 诊断应用（打印块设备 / FAT / unixnu.toml 可见性）"
        required: true
        default: true
        type: boolean
      fetch_hakios:
        description: "下载 HakiOS 的 prebuilt（loader.efi + mach 内核）到 artifact 里备用"
        required: true
        default: true
        type: boolean
      add_payload:
        description: "把 payload FAT 卷（EFI/UniXNU/unixnu.toml）作为 ramdisk 打进启动镜像（阶段 3 验证）"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  # 上游 setup_env.sh 里导出的关键变量，CLANGPDB 交叉编译必须要有
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
  CI_BUILD: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout（只为拿到本 workflow）
        uses: actions/checkout@v4

      - name: 克隆 uefi-sheng 与顶层子模块
        run: |
          git clone --depth 1 --branch sheng https://github.com/UniXNU/uefi-sheng.git uefi-sheng
          cd uefi-sheng
          # 只初始化顶层子模块：openssl 自带的测试套件子模块（tlsfuzzer 等）构建不需要
          git submodule update --init --depth 1
          echo "--- 自检 ---"
          ls Platforms/Xiaomi/peridotPkg
          ls Silicon/Qualcomm | head -10

      - name: 集成 UniXNU 组件（UniXNUPkg + DarwinBootPkg）
        if: inputs.add_unixnu == true
        run: |
          set -euo pipefail
          # 官方文档：UniXNURamDiskDxe 源码在 UniXNU 主仓 package/UniXNUPkg/；
          # DarwinBootPkg 在独立仓库 UniXNU/DarwinBoot 根目录。
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git unixnu-src
          git clone --depth 1 https://github.com/UniXNU/DarwinBoot.git darwinboot-src

          # 放进 PACKAGES_PATH 里已有的 Platforms/Xiaomi，这样 dsc 里的
          # `UniXNUPkg/...` 和 `DarwinBootPkg/...` 不用改包搜索路径就能解析。
          cp -r unixnu-src/package/UniXNUPkg uefi-sheng/Platforms/Xiaomi/UniXNUPkg
          cp -r darwinboot-src/DarwinBootPkg uefi-sheng/Platforms/Xiaomi/DarwinBootPkg

          ls uefi-sheng/Platforms/Xiaomi/UniXNUPkg
          ls uefi-sheng/Platforms/Xiaomi/DarwinBootPkg

          DSC="uefi-sheng/Platforms/Xiaomi/peridotPkg/peridot.dsc"
          DXE="uefi-sheng/Platforms/Xiaomi/peridotPkg/Include/DXE.inc"

          cat >> "$DSC" <<'DSCEOF'

          [LibraryClasses]
            UniXNULib|UniXNUPkg/Library/UniXNULib/UniXNULib.inf
            FdtLib|MdePkg/Library/BaseFdtLib/BaseFdtLib.inf
            HobLib|MdePkg/Library/DxeHobLib/DxeHobLib.inf

          [Components]
            UniXNUPkg/Application/UniXNU/UniXNU.inf
            UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf
            UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf
            DarwinBootPkg/Driver/DarwinBoot.inf
          DSCEOF

          cat >> "$DXE" <<'DXEEOF'

            INF UniXNUPkg/Application/UniXNU/UniXNU.inf
            INF UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf
            INF UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf
            INF DarwinBootPkg/Driver/DarwinBoot.inf
          DXEEOF

          echo "--- dsc 尾部 ---"; tail -18 "$DSC"
          echo "--- DXE.inc 尾部 ---"; tail -6 "$DXE"

      - name: 注入 PeridotProbe 诊断应用
        if: inputs.add_probe == true
        run: |
          set -euo pipefail
          APP="uefi-sheng/Silicium-ACPI/Platforms/Xiaomi/peridot/PeridotProbe"
          DSC="uefi-sheng/Platforms/Xiaomi/peridotPkg/peridot.dsc"
          DXE="uefi-sheng/Platforms/Xiaomi/peridotPkg/Include/DXE.inc"
          COMP="peridot/PeridotProbe/PeridotProbe.inf"
          mkdir -p "$APP"

          cat > "$APP/PeridotProbe.c" <<'CEOF'
          #include <Uefi.h>
          #include <Library/UefiBootServicesTableLib.h>
          #include <Library/UefiLib.h>
          #include <Protocol/BlockIo.h>
          #include <Protocol/SimpleFileSystem.h>
          #include <Protocol/SimpleTextIn.h>

          STATIC
          VOID
          TryToml (
            IN EFI_FILE_PROTOCOL  *Root
            )
          {
            EFI_FILE_PROTOCOL *F;
            EFI_STATUS         S;

            F = NULL;
            S = Root->Open (Root, &F, L"\\EFI\\UniXNU\\unixnu.toml", EFI_FILE_MODE_READ, 0);
            if (!EFI_ERROR (S)) {
              Print (L"      toml: FOUND (EFI/UniXNU)\n");
              F->Close (F);
            } else {
              Print (L"      toml: not in EFI/UniXNU (%r)\n", S);
            }

            F = NULL;
            S = Root->Open (Root, &F, L"\\unixnu.toml", EFI_FILE_MODE_READ, 0);
            if (!EFI_ERROR (S)) {
              Print (L"      toml: FOUND (root)\n");
              F->Close (F);
            }
          }

          EFI_STATUS
          EFIAPI
          PeridotProbeEntry (
            IN EFI_HANDLE        ImageHandle,
            IN EFI_SYSTEM_TABLE  *SystemTable
            )
          {
            EFI_STATUS                       Status;
            EFI_HANDLE                       *Handles;
            UINTN                            Count;
            UINTN                            i;
            EFI_BLOCK_IO_PROTOCOL            *Bio;
            EFI_SIMPLE_FILE_SYSTEM_PROTOCOL  *Fs;
            EFI_FILE_PROTOCOL                *Root;
            EFI_INPUT_KEY                    Key;

            SystemTable->ConOut->ClearScreen (SystemTable->ConOut);
            Print (L"\n=== PeridotProbe ===\n");

            Handles = NULL;
            Count   = 0;
            Status  = gBS->LocateHandleBuffer (ByProtocol, &gEfiBlockIoProtocolGuid, NULL, &Count, &Handles);
            Print (L"BlockIo handles: %u (%r)\n", Count, Status);

            for (i = 0; i < Count; i++) {
              Bio = NULL;
              if (EFI_ERROR (gBS->HandleProtocol (Handles[i], &gEfiBlockIoProtocolGuid, (VOID **)&Bio))) {
                continue;
              }
              Print (
                L"  [%u] last_block=%lu block_size=%u present=%u ro=%u\n",
                i,
                Bio->Media->LastBlock + 1,
                (UINTN)Bio->Media->BlockSize,
                (UINTN)Bio->Media->MediaPresent,
                (UINTN)Bio->Media->ReadOnly
                );

              Fs = NULL;
              if (!EFI_ERROR (gBS->HandleProtocol (Handles[i], &gEfiSimpleFileSystemProtocolGuid, (VOID **)&Fs))) {
                Root = NULL;
                if (!EFI_ERROR (Fs->OpenVolume (Fs, &Root))) {
                  Print (L"      FS: mounted\n");
                  TryToml (Root);
                  Root->Close (Root);
                } else {
                  Print (L"      FS: OpenVolume failed\n");
                }
              } else {
                Print (L"      FS: none\n");
              }
            }

            Print (L"\n=== PROBE HOLD ===\n");
            Print (L"screen stays here on purpose. power off / reboot to leave.\n");
            //
            // 故意不返回：返回后 BDS 会继续 dispatch，UEFI debug 输出会把这一屏顶掉。
            //
            for ( ; ; ) {
              gBS->Stall (1000000);
            }

            return EFI_SUCCESS;
          }
          CEOF

          cat > "$APP/PeridotProbe.inf" <<'IEOF'
          ## @file
          #  PeridotProbe - boot-time probe (DXE driver, dispatched before BDS)
          #  SPDX-License-Identifier: BSD-2-Clause-Patent
          ##

          [Defines]
            INF_VERSION                    = 0x00010005
            BASE_NAME                      = PeridotProbe
            FILE_GUID                      = 3a7f2c11-9d64-4b02-8e51-6c4a1f0d8b27
            MODULE_TYPE                    = DXE_DRIVER
            VERSION_STRING                 = 1.0
            ENTRY_POINT                    = PeridotProbeEntry

          [Sources]
            PeridotProbe.c

          [Packages]
            MdePkg/MdePkg.dec
            MdeModulePkg/MdeModulePkg.dec

          [LibraryClasses]
            UefiBootServicesTableLib
            UefiLib
            UefiDriverEntryPoint

          [Protocols]
            gEfiBlockIoProtocolGuid
            gEfiSimpleFileSystemProtocolGuid
            gEfiBdsArchProtocolGuid

          [Depex]
            gEfiBdsArchProtocolGuid
          IEOF

          if ! grep -q 'PeridotProbe' "$DSC"; then
            printf '\n  %s\n' "$COMP" >> "$DSC"
          fi
          if ! grep -q 'PeridotProbe' "$DXE"; then
            printf '\n  INF %s\n' "$COMP" >> "$DXE"
          fi
          tail -4 "$DSC"; tail -4 "$DXE"

      - name: 安装依赖（固定清单，跳过 apt update）
        working-directory: uefi-sheng
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 不跑 apt-get update：镜像自带索引，那一步才是 30 分钟的元凶。
          # 这份清单是把前面几次踩过的坑一次补齐的：
          #   clang/lld/llvm -> clang、lld-link、llvm-objcopy（BootShim 的 Makefile 要用）
          #   nasm/acpica-tools -> EDK2 汇编器与 iasl
          #   mono-devel -> EDK2 的 NuGet 依赖（mu_nasm）在 Linux 上必须靠 mono 跑
          #   mtools/dosfstools -> 造 payload FAT 卷
          #   uuid-dev -> BaseTools
          APT_OPTS="-y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20"
          sudo -E apt-get install $APT_OPTS \
            nasm acpica-tools mtools dosfstools uuid-dev \
            clang lld llvm mono-devel
          # ca-certificates-mono 在部分镜像里不存在，装不上不影响
          sudo -E apt-get install -y --no-install-recommends ca-certificates-mono || true

          # llvm-objcopy / lld-link 在 /usr/lib/llvm-*/bin，不在默认 PATH
          for d in /usr/lib/llvm-*/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          export PATH="$(ls -d /usr/lib/llvm-*/bin 2>/dev/null | tail -1):$PATH"

          python3 -m pip install --break-system-packages -q -r pip-requirements.txt

          echo "================ 工具链自检 ================"
          printf "%-16s" "clang"        ; clang --version 2>/dev/null | head -1 || echo MISSING
          printf "%-16s" "lld-link"     ; lld-link --version 2>/dev/null | head -1 || echo MISSING
          printf "%-16s" "llvm-objcopy" ; llvm-objcopy --version 2>/dev/null | head -1 || echo MISSING
          printf "%-16s" "nasm"         ; nasm -v 2>/dev/null || echo MISSING
          printf "%-16s" "iasl"         ; iasl -v 2>/dev/null | head -1 || echo MISSING
          printf "%-16s" "mono"         ; mono --version 2>/dev/null | head -1 || echo MISSING
          printf "%-16s" "mformat"      ; command -v mformat || echo MISSING
          printf "%-16s" "mkfs.vfat"    ; command -v mkfs.vfat || echo MISSING
          printf "%-16s" "perl"         ; perl -v 2>/dev/null | sed -n 2p || echo MISSING
          echo "============================================"

      - name: 构建 peridot
        id: build
        working-directory: uefi-sheng
        env:
          MODE: ${{ inputs.mode }}
          ACPI_WA: ${{ inputs.allow_acpi_workaround }}
        run: |
          set +e
          # -u：跑 git submodule update + DeviceBuild.py --setup --update
          # 不加 -u 时只要 Build/ 存在就会跳过环境准备，依赖不会被补
          python3 build_uefi.py -d peridot -r "$MODE" -c -m 0 -u 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "first attempt exit=$rc"

          if [ "$rc" -ne 0 ] && [ "$ACPI_WA" = "true" ] && grep -qi 'AcpiTables' build.log; then
            echo "=== 命中 AcpiTables 缺失，注释该组件后重试 ==="
            sed -i 's|^[[:space:]]*peridot/AcpiTables\.inf|  # peridot/AcpiTables.inf|' \
              Platforms/Xiaomi/peridotPkg/peridot.dsc
            grep -n 'AcpiTables' Platforms/Xiaomi/peridotPkg/peridot.dsc || true
            python3 build_uefi.py -d peridot -r "$MODE" -c -m 0 -u 2>&1 | tee -a build.log
            rc=${PIPESTATUS[0]}
            echo "second attempt exit=$rc"
          fi

          echo "exit=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" -ne 0 ]; then
            echo "================ 构建错误汇总 ================"
            grep -n -iE "error|traceback|critical|failed|not found|does not exist" build.log | tail -40 || true
            echo "================ build.log 最后 40 行 ================"
            tail -40 build.log || true
            echo "=============================================="
          fi

          exit 0

      - name: 打包 payload ramdisk（阶段 3 验证）
        id: payload
        if: inputs.add_payload == true
        working-directory: uefi-sheng
        run: |
          set -euo pipefail
          mkdir -p ../out

          if [ ! -f Mu-peridot.img ]; then
            echo "!! Mu-peridot.img 不存在：上一步『构建 peridot』失败了，请先看那一步的错误汇总"
            exit 1
          fi

          # 1) 从刚构建的启动镜像里取出 kernel 字段（就是 gzip 过的 UEFI FD）
          python3 - <<'PY'
          import pathlib, struct
          b = pathlib.Path("Mu-peridot.img").read_bytes()
          magic, ksize = struct.unpack("<8sI", b[:12])
          assert magic == b"ANDROID!", magic
          ker = b[4096:4096 + ksize]
          pathlib.Path("../out/kernel.bin").write_bytes(ker)
          print(f"kernel field: {len(ker)} bytes")
          PY

          # 2) 造 2 MiB FAT 卷，写入 unixnu.toml 和占位内核
          dd if=/dev/zero of=../out/payload.img bs=1M count=2 status=none
          mformat -i ../out/payload.img -v UNIXNU ::
          mmd -i ../out/payload.img ::EFI
          mmd -i ../out/payload.img ::EFI/UniXNU
          mmd -i ../out/payload.img ::EFI/UniXNU/Payloads

          cat > ../out/unixnu.toml <<'TOMLEOF'
          version = 1

          [boot]
          timeout = 5
          default = "xnu"

          [kits]
          autoload = false

          [[entry]]
          id = "xnu"
          title = "UniXNU"
          type = "xnu"
          path = "Payloads/kernel.macho"
          args = "-v serial=3"
          TOMLEOF

          mcopy -i ../out/payload.img ../out/unixnu.toml ::EFI/UniXNU/unixnu.toml
          # 兜底：某些加载器会从卷根找配置
          mcopy -i ../out/payload.img ../out/unixnu.toml ::unixnu.toml

          # 占位内核：故意不是 Mach-O，用来验证"菜单出现条目 -> DarwinBoot 拒绝"这条链
          head -c 4096 /dev/urandom > ../out/kernel.macho
          mcopy -i ../out/payload.img ../out/kernel.macho ::EFI/UniXNU/Payloads/kernel.macho

          echo "--- 卷内容 ---"
          mdir -i ../out/payload.img ::/EFI/UniXNU
          mdir -i ../out/payload.img ::/EFI/UniXNU/Payloads

          # 3) 用仓库自带的 mkbootimg 重新打包（header v4，和上游一致）
          python3 Resources/Scripts/mkbootimg.py \
            --kernel ../out/kernel.bin \
            --ramdisk ../out/payload.img \
            --header_version 4 \
            --pagesize 4096 \
            -o ../out/Mu-peridot-payload.img

          ls -lh ../out/kernel.bin ../out/payload.img ../out/Mu-peridot-payload.img

      - name: 下载 HakiOS prebuilt（loader.efi + 内核）
        if: inputs.fetch_hakios == true
        run: |
          set -euo pipefail
          mkdir -p out/hakios
          BASE="https://raw.githubusercontent.com/oosexgang/hackios-xnu-kernel/main/prebuilt"
          curl -L --fail --retry 3 -o out/hakios/loader.efi       "$BASE/loader.efi"
          curl -L --fail --retry 3 -o out/hakios/mach.development.bcm2837 "$BASE/mach.development.bcm2837"
          ls -lh out/hakios

      - name: 收集产物
        if: always()
        working-directory: uefi-sheng
        run: |
          mkdir -p ../out
          find Build -type f -name '*.fd' -exec cp -v {} ../out/ \; || true
          find . -maxdepth 1 -type f -name 'Mu-*' -exec cp -v {} ../out/ \; || true
          cp -v build.log ../out/ || true
          echo "--- out ---"
          ls -lh ../out || true

          echo "--- 载荷相关产物 ---"
          ls -lh ../out/kernel.bin ../out/payload.img ../out/Mu-peridot-payload.img 2>/dev/null || true

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-uefi-fd
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: 构建结果
        run: |
          echo "构建退出码: ${{ steps.build.outputs.exit }}"
          if [ "${{ steps.build.outputs.exit }}" != "0" ]; then
            echo "::error::构建失败，下载 artifact 里的 build.log 查看原因"
            exit 1
          fi
