name: build peridot UEFI

# 在 GitHub 的 Ubuntu runner 上编译 peridot 的 UEFI 固件。
# 用法：仓库 Actions 页 → 左侧 "build peridot UEFI" → Run workflow → 跑完下载 artifact。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建类型"
        required: true
        default: "DEBUG"
        type: choice
        options: [DEBUG, RELEASE]
      allow_acpi_workaround:
        description: "报 AcpiTables 缺失时自动注释该组件并重试"
        required: true
        default: true
        type: boolean
      add_unixnu:
        description: "集成 UniXNUPkg + DarwinBootPkg（UniXNU 菜单与 XNU 加载器）"
        required: true
        default: true
        type: boolean
      add_hello:
        description: "注入自写的 PeridotHello EFI 应用（用于验证自定义 EFI 程序能运行）"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  # 上游 setup_env.sh 里导出的关键变量，CLANGPDB 交叉编译必须要有
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
  CI_BUILD: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout（只为拿到本 workflow）
        uses: actions/checkout@v4

      - name: 克隆 uefi-sheng 与顶层子模块
        run: |
          git clone --depth 1 --branch sheng https://github.com/UniXNU/uefi-sheng.git uefi-sheng
          cd uefi-sheng
          # 只初始化顶层子模块：openssl 自带的测试套件子模块（tlsfuzzer 等）构建不需要
          git submodule update --init --depth 1
          echo "--- 自检 ---"
          ls Platforms/Xiaomi/peridotPkg
          ls Silicon/Qualcomm | head -10

      - name: 集成 UniXNU 组件（UniXNUPkg + DarwinBootPkg）
        if: inputs.add_unixnu == true
        run: |
          set -euo pipefail
          # 官方文档：UniXNURamDiskDxe 源码在 UniXNU 主仓 package/UniXNUPkg/；
          # DarwinBootPkg 在独立仓库 UniXNU/DarwinBoot 根目录。
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git unixnu-src
          git clone --depth 1 https://github.com/UniXNU/DarwinBoot.git darwinboot-src

          # 放进 PACKAGES_PATH 里已有的 Platforms/Xiaomi，这样 dsc 里的
          # `UniXNUPkg/...` 和 `DarwinBootPkg/...` 不用改包搜索路径就能解析。
          cp -r unixnu-src/package/UniXNUPkg uefi-sheng/Platforms/Xiaomi/UniXNUPkg
          cp -r darwinboot-src/DarwinBootPkg uefi-sheng/Platforms/Xiaomi/DarwinBootPkg

          ls uefi-sheng/Platforms/Xiaomi/UniXNUPkg
          ls uefi-sheng/Platforms/Xiaomi/DarwinBootPkg

          DSC="uefi-sheng/Platforms/Xiaomi/peridotPkg/peridot.dsc"
          DXE="uefi-sheng/Platforms/Xiaomi/peridotPkg/Include/DXE.inc"

          cat >> "$DSC" <<'DSCEOF'

          [LibraryClasses]
            UniXNULib|UniXNUPkg/Library/UniXNULib/UniXNULib.inf
            FdtLib|MdePkg/Library/BaseFdtLib/BaseFdtLib.inf
            HobLib|MdePkg/Library/DxeHobLib/DxeHobLib.inf

          [Components]
            UniXNUPkg/Application/UniXNU/UniXNU.inf
            UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf
            UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf
            DarwinBootPkg/Driver/DarwinBoot.inf
          DSCEOF

          cat >> "$DXE" <<'DXEEOF'

            INF UniXNUPkg/Application/UniXNU/UniXNU.inf
            INF UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf
            INF UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf
            INF DarwinBootPkg/Driver/DarwinBoot.inf
          DXEEOF

          echo "--- dsc 尾部 ---"; tail -18 "$DSC"
          echo "--- DXE.inc 尾部 ---"; tail -6 "$DXE"

      - name: 注入 PeridotHello EFI 应用
        if: inputs.add_hello == true
        run: |
          set -euo pipefail
          # 放在和 peridot/AcpiTables.inf 同一个包根下（Silicium-ACPI/Platforms/Xiaomi），
          # 这样 [Components] 里的 `peridot/PeridotHello/...` 和已知能解析的
          # `peridot/AcpiTables.inf` 走同一套解析规则，避免包根猜错。
          APP_DST="uefi-sheng/Silicium-ACPI/Platforms/Xiaomi/peridot/PeridotHello"
          DSC="uefi-sheng/Platforms/Xiaomi/peridotPkg/peridot.dsc"
          DXE="uefi-sheng/Platforms/Xiaomi/peridotPkg/Include/DXE.inc"
          COMP="peridot/PeridotHello/PeridotHello.inf"

          mkdir -p "$APP_DST"

          cat > "$APP_DST/PeridotHello.c" <<'CEOF'
          #include <Uefi.h>
          #include <Library/UefiBootServicesTableLib.h>
          #include <Library/UefiLib.h>
          #include <Protocol/GraphicsOutput.h>
          #include <Protocol/SimpleTextIn.h>

          EFI_STATUS
          EFIAPI
          UefiMain (
            IN EFI_HANDLE        ImageHandle,
            IN EFI_SYSTEM_TABLE  *SystemTable
            )
          {
            EFI_STATUS                     Status;
            EFI_GRAPHICS_OUTPUT_PROTOCOL   *Gop;
            EFI_INPUT_KEY                  Key;
            EFI_GRAPHICS_OUTPUT_BLT_PIXEL  Pixel;
            UINTN                          W;
            UINTN                          H;
            UINTN                          Idx;
            UINTN                          i;

            Gop = NULL;
            Print (L"\n=== PeridotHello ===\n");
            Status = gBS->LocateProtocol (&gEfiGraphicsOutputProtocolGuid, NULL, (VOID **)&Gop);
            if (!EFI_ERROR (Status) && (Gop != NULL)) {
              W = (UINTN)Gop->Mode->Info->HorizontalResolution;
              H = (UINTN)Gop->Mode->Info->VerticalResolution;
              Print (L"GOP %ux%u mode %u\n", W, H, (UINTN)Gop->Mode->Mode);
              Pixel.Reserved = 0;
              Pixel.Red = 0xE0; Pixel.Green = 0x20; Pixel.Blue = 0x20;
              Gop->Blt (Gop, &Pixel, EfiBltVideoFill, 0, 0, 0, 0, W, H / 4, 0);
              Pixel.Red = 0x20; Pixel.Green = 0xE0; Pixel.Blue = 0x20;
              Gop->Blt (Gop, &Pixel, EfiBltVideoFill, 0, 0, 0, H / 4, W, H / 4, 0);
              Pixel.Red = 0x20; Pixel.Green = 0x20; Pixel.Blue = 0xE0;
              Gop->Blt (Gop, &Pixel, EfiBltVideoFill, 0, 0, 0, H / 2, W, H / 4, 0);
              Pixel.Red = 0xFF; Pixel.Green = 0xFF; Pixel.Blue = 0xFF;
              Gop->Blt (Gop, &Pixel, EfiBltVideoFill, 0, 0, 0, (H / 4) * 3, W, H / 4, 0);
            } else {
              Print (L"GOP not found: %r\n", Status);
            }

            Print (L"press keys, ESC exits\n");
            for (i = 0; i < 64; i++) {
              Idx = 0;
              if (EFI_ERROR (gBS->WaitForEvent (1, &SystemTable->ConIn->WaitForKey, &Idx))) {
                break;
              }
              if (EFI_ERROR (SystemTable->ConIn->ReadKeyStroke (SystemTable->ConIn, &Key))) {
                continue;
              }
              Print (L"key scan=0x%x uni=0x%x\n", (UINTN)Key.ScanCode, (UINTN)Key.UnicodeChar);
              if (Key.ScanCode == SCAN_ESC) {
                break;
              }
            }

            return EFI_SUCCESS;
          }
          CEOF

          cat > "$APP_DST/PeridotHello.inf" <<'IEOF'
          ## @file
          #  PeridotHello - minimal UEFI application for peridot bring-up
          #  SPDX-License-Identifier: BSD-2-Clause-Patent
          ##

          [Defines]
            INF_VERSION                    = 0x00010005
            BASE_NAME                      = PeridotHello
            FILE_GUID                      = 7d3c1e64-2b8a-4f19-9a6c-5e0b41c2d7f3
            MODULE_TYPE                    = UEFI_APPLICATION
            VERSION_STRING                 = 1.0
            ENTRY_POINT                    = UefiMain

          [Sources]
            PeridotHello.c

          [Packages]
            MdePkg/MdePkg.dec
            MdeModulePkg/MdeModulePkg.dec

          [LibraryClasses]
            UefiApplicationEntryPoint
            UefiBootServicesTableLib
            UefiLib

          [Protocols]
            gEfiGraphicsOutputProtocolGuid        ## CONSUMES
          IEOF

          ls -l "$APP_DST"

          # [Components] 是 dsc 的最后一段，追加一行即可
          if ! grep -q 'PeridotHello' "$DSC"; then
            printf '\n  %s\n' "$COMP" >> "$DSC"
          fi

          # 让 FDF 把这个 INF 打进 DXE 固件卷，否则编了也不进镜像
          # DXE.inc 里每一行都是 `INF <path>` 的形式；漏了 INF 关键字 FDF 会报
          # "expected [FD.] near line ..."，所以这里必须带前缀。
          if [ -f "$DXE" ] && ! grep -q 'PeridotHello' "$DXE"; then
            printf '\n  INF %s\n' "$COMP" >> "$DXE"
          fi

          echo "--- dsc 尾部 ---"; tail -6 "$DSC"
          echo "--- DXE.inc 尾部 ---"; tail -4 "$DXE" 2>/dev/null || echo "(no DXE.inc)"

      - name: 安装依赖（用上游的 setup_env.sh）
        working-directory: uefi-sheng
        run: |
          bash ./setup_env.sh -p apt
          echo "--- 工具链 ---"
          clang --version | head -1
          nasm -v
          iasl -v | head -1
          mono --version | head -1

      - name: 构建 peridot
        id: build
        working-directory: uefi-sheng
        env:
          MODE: ${{ inputs.mode }}
          ACPI_WA: ${{ inputs.allow_acpi_workaround }}
        run: |
          set +e
          # -u：跑 git submodule update + DeviceBuild.py --setup --update
          # 不加 -u 时只要 Build/ 存在就会跳过环境准备，依赖不会被补
          python3 build_uefi.py -d peridot -r "$MODE" -c -m 0 -u 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "first attempt exit=$rc"

          if [ "$rc" -ne 0 ] && [ "$ACPI_WA" = "true" ] && grep -qi 'AcpiTables' build.log; then
            echo "=== 命中 AcpiTables 缺失，注释该组件后重试 ==="
            sed -i 's|^[[:space:]]*peridot/AcpiTables\.inf|  # peridot/AcpiTables.inf|' \
              Platforms/Xiaomi/peridotPkg/peridot.dsc
            grep -n 'AcpiTables' Platforms/Xiaomi/peridotPkg/peridot.dsc || true
            python3 build_uefi.py -d peridot -r "$MODE" -c -m 0 -u 2>&1 | tee -a build.log
            rc=${PIPESTATUS[0]}
            echo "second attempt exit=$rc"
          fi

          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 收集产物
        if: always()
        working-directory: uefi-sheng
        run: |
          mkdir -p ../out
          find Build -type f -name '*.fd' -exec cp -v {} ../out/ \; || true
          find . -maxdepth 1 -type f -name 'Mu-*' -exec cp -v {} ../out/ \; || true
          cp -v build.log ../out/ || true
          echo "--- out ---"
          ls -lh ../out || true

          echo "--- 检查 PeridotHello 是否真的进了固件 ---"
          grep -c 'PeridotHello' build.log || true
          python3 - <<'PY'
          import pathlib
          needle = "=== PeridotHello ===".encode("utf-16-le")
          hit = False
          for p in list(pathlib.Path("Build").rglob("*.fd")) + list(pathlib.Path(".").glob("Mu-*")):
              try:
                  data = p.read_bytes()
              except Exception:
                  continue
              if needle in data:
                  print(f"[ok] {p} 含有 PeridotHello 字符串")
                  hit = True
          if not hit:
              print("[warn] 没有在任何镜像里找到 PeridotHello 字符串——应用可能没被打进 FV")
          PY

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-uefi-fd
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: 构建结果
        run: |
          echo "构建退出码: ${{ steps.build.outputs.exit }}"
          if [ "${{ steps.build.outputs.exit }}" != "0" ]; then
            echo "::error::构建失败，下载 artifact 里的 build.log 查看原因"
            exit 1
          fi
